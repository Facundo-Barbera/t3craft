plugins {
	// Non-remapping Loom plugin: Minecraft 26.x ships unobfuscated, so there is no mappings layer.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Mod Menu API (compile-only, optional integration in dev.t3craft.client.config).
	exclusiveContent {
		forRepository { maven { url = "https://maven.terraformersmc.com/releases/" } }
		filter { includeGroup "com.terraformersmc" }
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"t3craft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			def player = (System.getenv("T3CRAFT_PLAYER") ?: System.getProperty("user.name") ?: "Player")
					.replaceAll(/[^A-Za-z0-9_]/, "").take(16) ?: "Player"
			programArgs "--username", player
			runDir "run"
			// Opt-in enhanced hot-swap (docs/dev.md): `./gradlew runClient -Pt3craft.hotswap`.
			// Needs a JetBrains Runtime as the run JVM; plain JDKs refuse to start with this flag.
			if (project.hasProperty("t3craft.hotswap")) {
				vmArgs "-XX:+AllowEnhancedClassRedefinition", "-Dt3craft.devreload=true"
			}
		}
	}
}

// Client GameTests (src/gametest): `./gradlew runClientGameTest` boots a real client, so it is NOT
// part of `build`/`check` and must not run on the VPS. CI runs it in its own job under xvfb.
// Server GameTests stay off: Loom would hook them into `check` and the mod is client-only anyway.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "t3craft-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = true
	}
}

sourceSets {
	gametest {
		// The tests poke at client-side classes (dev.t3craft.client.*), not just main.
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional: only the API interfaces, never bundled nor required at runtime ("suggests" in fabric.mod.json).
	clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	// Unit tests for the pure T3 client logic (dev.t3craft.t3): framing, shell state, mapping,
	// visibility, pairing. No Minecraft classes involved.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Pure client-side logic lives in the client source set but its tests only touch Minecraft-free classes:
// portable terminal (dev.t3craft.client.portable: navigation, state, notification log),
// NPC behaviour (dev.t3craft.client.npc.behavior: pathfinder, brain, layout, bubbles),
// chat (dev.t3craft.client.chat: Markdown, wrap, transcript, thread list) and
// config (dev.t3craft.client.config).
sourceSets.test {
	compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
	runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}

// Compile (not run) the client GameTests on every build so they cannot rot silently.
tasks.named("check") {
	dependsOn tasks.named("gametestClasses")
}

// hq-render (docs/research/hq-style-c/README.md): headless PNG renders of the HQ BuildPlan for
// design review. Its own source set, so nothing of it ends up in the mod jar; it reads block models
// and textures from the Minecraft jar already on the classpath (in memory, nothing is copied).
// Not part of build: `./gradlew hqRender [-PhqArgs="--style classic --only full"]`.
sourceSets {
	hqrender {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

tasks.named("check") {
	dependsOn tasks.named("hqrenderClasses")
}

tasks.register("hqRender", JavaExec) {
	group = "t3craft"
	description = "Renders the HQ (every style view) to PNGs in build/hq-render, headless"
	classpath = sourceSets.hqrender.runtimeClasspath
	mainClass = "dev.t3craft.tools.hqrender.HqRender"
	systemProperty "java.awt.headless", "true"
	maxHeapSize = "4g"
	workingDir = projectDir
	args((project.findProperty("hqArgs") ?: "").toString().split(" ").findAll { it })
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

// fix/hq-build-parallel: headless build benchmark of every layout with 20 projects, no Minecraft launched.
// `./gradlew hqBuildBench` → build/reports/hq-build-bench.md (also runs inside `test`).
tasks.register("hqBuildBench", Test) {
	group = "t3craft"
	description = "Simulates the HQ world build of every layout (before/after parallel parts) and writes build/reports/hq-build-bench.md"
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching "dev.t3craft.client.demo.HqBuildBenchTest" }
	outputs.upToDateWhen { false }
	testLogging { showStandardStreams = true }
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

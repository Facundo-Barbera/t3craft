plugins {
	// Non-remapping Loom plugin: Minecraft 26.x ships unobfuscated, so there is no mappings layer.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Mod Menu API (compile-only, optional integration in dev.t3craft.client.config).
	exclusiveContent {
		forRepository { maven { url = "https://maven.terraformersmc.com/releases/" } }
		filter { includeGroup "com.terraformersmc" }
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"t3craft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			def player = (System.getenv("T3CRAFT_PLAYER") ?: System.getProperty("user.name") ?: "Player")
					.replaceAll(/[^A-Za-z0-9_]/, "").take(16) ?: "Player"
			programArgs "--username", player
			runDir "run"
			// Opt-in enhanced hot-swap (docs/dev.md): `./gradlew runClient -Pt3craft.hotswap`.
			// Needs a JetBrains Runtime as the run JVM; plain JDKs refuse to start with this flag.
			if (project.hasProperty("t3craft.hotswap")) {
				vmArgs "-XX:+AllowEnhancedClassRedefinition", "-Dt3craft.devreload=true"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional: only the API interfaces, never bundled nor required at runtime ("suggests" in fabric.mod.json).
	clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

// hq-render (docs/tools/hq-render.md): headless PNG renders of the HQ BuildPlan for
// design review. Its own source set, so nothing of it ends up in the mod jar; it reads block models
// and textures from the Minecraft jar already on the classpath (in memory, nothing is copied).
// Not part of build: `./gradlew hqRender [-PhqArgs="--style cherry --only full"]`.
sourceSets {
	hqrender {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

tasks.register("hqRender", JavaExec) {
	group = "t3craft"
	description = "Renders the HQ (every style view) to PNGs in build/hq-render, headless"
	classpath = sourceSets.hqrender.runtimeClasspath
	mainClass = "dev.t3craft.tools.hqrender.HqRender"
	systemProperty "java.awt.headless", "true"
	maxHeapSize = "4g"
	workingDir = projectDir
	args((project.findProperty("hqArgs") ?: "").toString().split(" ").findAll { it })
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

// Shared render service (docs/tools/render-service.md): the coordinator starts ONE long-lived JVM,
// dev.t3craft.tools.render.RenderDaemon, with tools/render/start-daemon.sh. This task only writes what
// that script needs (the daemon's classpath and the Java 25 binary); it does not run anything.
tasks.register("renderDaemonClasspath") {
	group = "t3craft"
	description = "Writes build/render-daemon/{classpath.txt,java.txt} for tools/render/start-daemon.sh"
	dependsOn "classes", "clientClasses", "hqrenderClasses"
	def outDir = layout.buildDirectory.dir("render-daemon")
	def cp = sourceSets.hqrender.runtimeClasspath
	def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
	doLast {
		def dir = outDir.get().asFile
		dir.mkdirs()
		new File(dir, "classpath.txt").text = cp.files.collect { it.absolutePath }.join(File.pathSeparator)
		new File(dir, "java.txt").text = launcher.get().executablePath.asFile.absolutePath
	}
}
// ui-render (docs/tools/ui-render.md): headless PNG renders of the game's own screens (T3Screen and
// its popovers) with mock data, no game, no GL. Its own source set (nothing of it ends up in the mod
// jar). It builds the real screens from the client classes, records what they draw through a
// GuiGraphicsExtractor subclass and rasterises it with Java2D using the glyphs and sprites in the
// Minecraft jar. Not part of build/check: `./gradlew uiRender [-PuiArgs="--scenario markdown --gui-scale 3"]`.
sourceSets {
	uirender {
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}
tasks.register("uiRender", JavaExec) {
	group = "t3craft"
	description = "Renders the T3 screens with mock data to PNGs in build/ui-render, headless"
	classpath = sourceSets.uirender.runtimeClasspath
	mainClass = "dev.t3craft.tools.uirender.UiRender"
	systemProperty "java.awt.headless", "true"
	maxHeapSize = "2g"
	workingDir = projectDir
	args((project.findProperty("uiArgs") ?: "").toString().split(" ").findAll { it })
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
// Icon pipeline (docs/tools/icons.md, issue #24): the Lucide SVGs in tools/art/icons/lucide are rasterised to
// white-on-transparent PNG sprites (t3craft:icons/<name>) by `generateIcons`, which runs before
// processResources and adds its output to the main resources. Only the SVGs are in the repo. Apache Batik
// lives in the `icons` source set (build time only): it is not in the mod jar nor in any run classpath.
// If Batik does not resolve or an icon does not rasterise, generateIcons fails and so does the build: the
// game is never shipped without its icons.
sourceSets {
	icons {
	}
}
dependencies {
	iconsImplementation "org.apache.xmlgraphics:batik-transcoder:${project.batik_version}"
	iconsImplementation "org.apache.xmlgraphics:batik-codec:${project.batik_version}"
}
def iconsSvgDir = layout.projectDirectory.dir("../tools/art/icons/lucide")
def iconsOutDir = layout.buildDirectory.dir("generated/icons")
def iconsPx = 32
def generateIcons = tasks.register("generateIcons", JavaExec) {
	group = "t3craft"
	description = "Rasterises tools/art/icons/lucide/*.svg to ${iconsPx} px white PNG sprites in build/generated/icons"
	classpath = sourceSets.icons.runtimeClasspath
	mainClass = "dev.t3craft.tools.icons.IconGen"
	systemProperty "java.awt.headless", "true"
	maxHeapSize = "512m"
	workingDir = projectDir
	// incremental: the SVGs, the size and the generator (its classpath) are the inputs
	inputs.dir(iconsSvgDir).withPropertyName("svgs").withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.property("iconPx", iconsPx)
	outputs.dir(iconsOutDir)
	args(iconsSvgDir.asFile.absolutePath,
			iconsOutDir.get().dir("assets/t3craft/textures/gui/sprites/icons").asFile.absolutePath,
			iconsPx.toString())
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
sourceSets.main.resources.srcDir(generateIcons)

// This repo does not use unit tests: adding or running them is forbidden; verification = compiling.
// Tests are blocked outright, so `test`, `check` and `build` never run any even if someone adds them back:
// no test sources, every Test task disabled, test compilation off, and `check` only compiles.
sourceSets.test {
	java.srcDirs = []
	resources.srcDirs = []
}
tasks.withType(Test).configureEach {
	enabled = false
}
tasks.matching { it.name in ["compileTestJava", "processTestResources", "testClasses"] }.configureEach {
	enabled = false
}
tasks.named("check") {
	setDependsOn([tasks.named("hqrenderClasses")])
}

processResources {
	dependsOn generateIcons
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

plugins {
	// Non-remapping Loom plugin: Minecraft 26.x ships unobfuscated, so there is no mappings layer.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Mod Menu API (compile-only, optional integration in dev.t3craft.client.config).
	exclusiveContent {
		forRepository { maven { url = "https://maven.terraformersmc.com/releases/" } }
		filter { includeGroup "com.terraformersmc" }
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"t3craft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			def player = (System.getenv("T3CRAFT_PLAYER") ?: System.getProperty("user.name") ?: "Player")
					.replaceAll(/[^A-Za-z0-9_]/, "").take(16) ?: "Player"
			programArgs "--username", player
			runDir "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional: only the API interfaces, never bundled nor required at runtime ("suggests" in fabric.mod.json).
	clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	// Unit tests for the pure T3 client logic (dev.t3craft.t3): framing, shell state, mapping,
	// visibility, pairing. No Minecraft classes involved.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Pure client-side logic lives in the client source set but its tests only touch Minecraft-free classes:
// portable terminal (dev.t3craft.client.portable: navigation, state, notification log),
// NPC behaviour (dev.t3craft.client.npc.behavior: pathfinder, brain, layout, bubbles) and
// config (dev.t3craft.client.config).
sourceSets.test {
	compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
	runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

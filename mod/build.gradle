plugins {
	// Non-remapping Loom plugin: Minecraft 26.x ships unobfuscated, so there is no mappings layer.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"t3craft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			def player = (System.getenv("T3CRAFT_PLAYER") ?: System.getProperty("user.name") ?: "Player")
					.replaceAll(/[^A-Za-z0-9_]/, "").take(16) ?: "Player"
			programArgs "--username", player
			runDir "run"
		}
	}
}

// Client GameTests (src/gametest): `./gradlew runClientGameTest` boots a real client, so it is NOT
// part of `build`/`check` and must not run on the VPS. CI runs it in its own job under xvfb.
// Server GameTests stay off: Loom would hook them into `check` and the mod is client-only anyway.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "t3craft-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = true
	}
}

sourceSets {
	gametest {
		// The tests poke at client-side classes (dev.t3craft.client.*), not just main.
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests for the pure T3 client logic (dev.t3craft.t3): framing, shell state, mapping,
	// visibility, pairing. No Minecraft classes involved.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Compile (not run) the client GameTests on every build so they cannot rot silently.
tasks.named("check") {
	dependsOn tasks.named("gametestClasses")
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

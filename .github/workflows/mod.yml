name: mod

on:
  push:
    paths: ["mod/**", ".github/workflows/mod.yml"]
  pull_request:
    paths: ["mod/**", ".github/workflows/mod.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mod

jobs:
  build:
    name: Build (compile only, no tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the cache; branches read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build (compile + jar; this repo has no tests)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: t3craft-mod-${{ github.sha }}
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
